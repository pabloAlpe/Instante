<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Instante · Granos</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050403; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #e9dccb;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }

  /* Panel */
  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px 16px;
    width: 232px;
    background: rgba(20,15,10,0.55);
    border: 1px solid rgba(233,220,203,0.12);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: opacity .35s ease, transform .35s ease;
  }
  #ui.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  #ui h1 {
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    font-weight: 600; color: #e9dccb; opacity: .9;
  }
  #ui .sub { font-size: 10.5px; line-height: 1.5; color: rgba(233,220,203,.5); margin-top:-4px; }
  .row { display: flex; flex-direction: column; gap: 5px; }
  .row label { font-size: 10.5px; letter-spacing: .04em; display: flex; justify-content: space-between; color: rgba(233,220,203,.72); }
  .row label b { color: #e9dccb; font-weight: 600; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; border-radius: 3px;
    background: rgba(233,220,203,0.20); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #e9dccb; cursor: pointer; border: 2px solid #1a120a;
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #e9dccb; cursor: pointer; border: 2px solid #1a120a;
  }
  .seg { display: flex; gap: 5px; }
  .seg button {
    flex: 1; font-size: 10.5px; letter-spacing: .03em;
    padding: 7px 0; border-radius: 8px; cursor: pointer;
    color: rgba(233,220,203,.7); background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    transition: background .16s ease, color .16s ease, border-color .16s ease;
  }
  .seg button.on {
    color: #0d0b08; background: #e9dccb; border-color: #e9dccb; font-weight: 600;
  }
  .btns { display: flex; gap: 8px; margin-top: 2px; }
  .btns button {
    flex: 1; font-size: 11px; letter-spacing: .04em;
    padding: 8px 0; border-radius: 9px; cursor: pointer;
    color: #e9dccb; background: rgba(233,220,203,0.08);
    border: 1px solid rgba(233,220,203,0.18);
    transition: background .18s ease;
  }
  .btns button:hover { background: rgba(233,220,203,0.18); }
  #toggleUi {
    position: fixed; top: 14px; left: 14px; z-index: 11;
    width: 40px; height: 40px; border-radius: 11px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    background: rgba(20,15,10,0.55); border: 1px solid rgba(233,220,203,0.12);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #e9dccb; font-size: 18px;
  }
  #toggleUi.show { display: flex; }
  #hint {
    position: fixed; bottom: 20px; left: 0; right: 0; z-index: 9;
    text-align: center; font-size: 12px; letter-spacing: .05em;
    color: rgba(233,220,203,.4); pointer-events: none;
    transition: opacity 1s ease; opacity: 1;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<button id="toggleUi" aria-label="ajustes">≡</button>
<div id="ui">
  <h1>Instante</h1>
  <div class="sub">Point cloud de granos. Elige la fuerza del dedo; siempre vuelven a su sitio.</div>

  <div class="row">
    <label>Modo del dedo</label>
    <div class="seg" id="mode">
      <button data-mode="push" class="on">Empujar</button>
      <button data-mode="vortex">Vórtice</button>
      <button data-mode="pull">Atraer</button>
    </div>
  </div>
  <div class="row">
    <label>Densidad <b id="vDensity"></b></label>
    <input id="density" type="range" min="2000" max="45000" step="500" value="6000">
  </div>
  <div class="row">
    <label>Radio del dedo <b id="vRadius"></b></label>
    <input id="radius" type="range" min="30" max="180" step="5" value="90">
  </div>
  <div class="row">
    <label>Fuerza del dedo <b id="vForce"></b></label>
    <input id="force" type="range" min="0.2" max="3" step="0.1" value="1.4">
  </div>
  <div class="row">
    <label>Retorno a casa <b id="vSpring"></b></label>
    <input id="spring" type="range" min="0.01" max="0.14" step="0.005" value="0.05">
  </div>
  <div class="row">
    <label>Colisión entre granos <b id="vCol"></b></label>
    <input id="collision" type="range" min="0" max="0.6" step="0.02" value="0.3">
  </div>
  <div class="row">
    <label>Flujo orgánico <b id="vFlow"></b></label>
    <input id="flow" type="range" min="0" max="1.5" step="0.05" value="0.5">
  </div>
  <div class="btns">
    <button id="reset">Reiniciar</button>
    <button id="hide">Ocultar</button>
  </div>
</div>

<div id="hint">arrastra el dedo sobre los granos</div>

<script>
"use strict";
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });

  // ---------- Config (editable desde el panel) ----------
  const cfg = {
    density:   6000,   // nº de granos objetivo
    pointerR:  100,    // radio de interacción del dedo (px)
    pointerF:  1.4,    // multiplicador de fuerza del dedo
    spring:    0.05,   // rigidez del muelle que devuelve a casa
    collision: 0.3,    // rigidez de colisión entre vecinos
    damping:   0.88,   // amortiguación de la velocidad (más alto = más glide)
    flow:      0.5,    // intensidad del campo de flujo orgánico (0..1)
    mode:      'push', // 'push' | 'vortex' | 'pull'
  };

  // ---------- Estado ----------
  let W = 0, H = 0, DPR = 1;
  let spacing = 22;                 // distancia entre granos en el grid
  let particles = [];
  let cols = 0, rows = 0, originX = 0, originY = 0;
  let grainR = 3;                   // radio base del punto (px)
  let tick = 0;                     // tiempo para animar el campo de flujo

  // Rejilla espacial para búsqueda de vecinos O(N)
  let gridCell = 0, gridW = 0, gridH = 0, grid = null;

  // Punteros activos (multi-touch + ratón)
  const pointers = new Map();       // id -> {x, y, px, py, active}

  // ---------- Ruido de valor (para el campo de color) ----------
  function hash2(ix, iy) {
    let h = ix * 374761393 + iy * 668265263;
    h = (h ^ (h >> 13)) * 1274126177;
    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function valueNoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const a = hash2(ix, iy),     b = hash2(ix + 1, iy);
    const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    const u = smooth(fx), v = smooth(fy);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  }

  // ---------- Paleta de grises (render minimal, puntos planos) ----------
  // Rampa de blanco (reposo) a negro (alta velocidad). Se dibuja por
  // niveles para agrupar los cientos de puntos en pocas llamadas.
  const LEVELS = 24;
  const GRAY = new Array(LEVELS);
  const buckets = new Array(LEVELS);
  for (let li = 0; li < LEVELS; li++) {
    const v = Math.round((li / (LEVELS - 1)) * 255);
    GRAY[li] = `rgb(${v},${v},${v})`;
    buckets[li] = [];
  }

  // ---------- Construcción del grid de partículas ----------
  function build() {
    // spacing a partir de la densidad objetivo y el área
    spacing = Math.max(4, Math.sqrt((W * H) / cfg.density));
    const margin = spacing * 0.5;
    cols = Math.floor((W - margin * 2) / spacing) + 1;
    rows = Math.floor((H - margin * 2) / spacing) + 1;
    // Centrar el grid
    const gridWpx = (cols - 1) * spacing;
    const gridHpx = (rows - 1) * spacing;
    originX = (W - gridWpx) / 2;
    originY = (H - gridHpx) / 2;

    // Radio del punto: pequeño respecto al espaciado -> look minimal con aire
    grainR = spacing * 0.30;

    particles = new Array(cols * rows);
    let k = 0;

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const hx = originX + i * spacing;
        const hy = originY + j * spacing;
        // jitter de posición inicial mínimo para que no sea un grid perfecto
        const jx = (hash2(i, j) - 0.5) * spacing * 0.12;
        const jy = (hash2(i + 99, j + 77) - 0.5) * spacing * 0.12;
        // Escala individual del grano
        const sc = 0.72 + hash2(i * 3, j * 5) * 0.5;
        particles[k++] = {
          x: hx + jx, y: hy + jy,
          hx, hy,
          vx: 0, vy: 0,
          scale: sc,
          // brillo en reposo: casi blanco, con textura sutil grano a grano
          rest: 0.9 + hash2(i * 7, j * 2) * 0.1,
        };
      }
    }

    // Rejilla espacial: celda ~ radio de colisión
    gridCell = spacing;
    gridW = Math.ceil(W / gridCell) + 1;
    gridH = Math.ceil(H / gridCell) + 1;
    grid = new Array(gridW * gridH);
  }

  // ---------- Rejilla espacial ----------
  function rebuildGrid() {
    for (let i = 0; i < grid.length; i++) grid[i] = null;
    for (let p = 0; p < particles.length; p++) {
      const pt = particles[p];
      let cx = (pt.x / gridCell) | 0;
      let cy = (pt.y / gridCell) | 0;
      if (cx < 0) cx = 0; else if (cx >= gridW) cx = gridW - 1;
      if (cy < 0) cy = 0; else if (cy >= gridH) cy = gridH - 1;
      const idx = cy * gridW + cx;
      pt.next = grid[idx];
      grid[idx] = pt;
    }
  }

  // ---------- Física ----------
  function step() {
    rebuildGrid();

    const spring = cfg.spring;
    const damp = cfg.damping;
    const colK = cfg.collision;
    const colDist = spacing * 0.92;      // umbral de colisión (compresión)
    const colDist2 = colDist * colDist;
    const pr = cfg.pointerR;
    const pr2 = pr * pr;
    const pf = cfg.pointerF;
    const maxV = spacing * 0.9;          // límite de velocidad (estabilidad)

    // Campo de flujo orgánico (curl noise). Solo empuja a los granos que
    // ya están desplazados de su sitio, así el reposo queda intacto y el
    // retorno y las interacciones fluyen en curvas suaves en vez de líneas.
    tick += 0.0035;
    const flowAmt = spacing * 0.055 * cfg.flow;
    const flowFreq = 1 / (spacing * 9);
    const dispRef = spacing * 3;          // desplazamiento para flujo pleno

    // Fuerzas: muelle a casa + flujo + colisión entre vecinos
    for (let p = 0; p < particles.length; p++) {
      const pt = particles[p];

      // Muelle hacia la posición de origen
      const dhx = pt.hx - pt.x, dhy = pt.hy - pt.y;
      pt.vx += dhx * spring;
      pt.vy += dhy * spring;

      // Flujo orgánico proporcional a lo desplazado que está el grano
      if (flowAmt > 0) {
        const disp = Math.sqrt(dhx * dhx + dhy * dhy);
        if (disp > 1) {
          const dz = disp < dispRef ? disp / dispRef : 1;
          const ang = valueNoise(pt.x * flowFreq + tick, pt.y * flowFreq - tick) * 12.566;
          pt.vx += Math.cos(ang) * flowAmt * dz;
          pt.vy += Math.sin(ang) * flowAmt * dz;
        }
      }

      // Colisión con vecinos (solo en compresión) usando la rejilla
      if (colK > 0) {
        const cx = Math.min(gridW - 1, Math.max(0, (pt.x / gridCell) | 0));
        const cy = Math.min(gridH - 1, Math.max(0, (pt.y / gridCell) | 0));
        for (let gy = cy - 1; gy <= cy + 1; gy++) {
          if (gy < 0 || gy >= gridH) continue;
          for (let gx = cx - 1; gx <= cx + 1; gx++) {
            if (gx < 0 || gx >= gridW) continue;
            let other = grid[gy * gridW + gx];
            while (other) {
              if (other !== pt) {
                const dx = pt.x - other.x;
                const dy = pt.y - other.y;
                const d2 = dx * dx + dy * dy;
                if (d2 < colDist2 && d2 > 1e-6) {
                  const d = Math.sqrt(d2);
                  const overlap = (colDist - d) / d;   // normalizado
                  const fx = dx * overlap * colK * 0.5;
                  const fy = dy * overlap * colK * 0.5;
                  pt.vx += fx; pt.vy += fy;
                }
              }
              other = other.next;
            }
          }
        }
      }
    }

    // Fuerza de los punteros (el "dedo"): empujar / vórtice / atraer
    const mode = cfg.mode;
    for (const ptr of pointers.values()) {
      if (!ptr.active) continue;
      const mvx = ptr.x - ptr.px;    // velocidad del dedo (arrastre)
      const mvy = ptr.y - ptr.py;
      let gx0 = Math.max(0, ((ptr.x - pr) / gridCell) | 0);
      let gx1 = Math.min(gridW - 1, ((ptr.x + pr) / gridCell) | 0);
      let gy0 = Math.max(0, ((ptr.y - pr) / gridCell) | 0);
      let gy1 = Math.min(gridH - 1, ((ptr.y + pr) / gridCell) | 0);
      for (let gy = gy0; gy <= gy1; gy++) {
        for (let gx = gx0; gx <= gx1; gx++) {
          let pt = grid[gy * gridW + gx];
          while (pt) {
            const dx = pt.x - ptr.x;
            const dy = pt.y - ptr.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < pr2) {
              const d = Math.sqrt(d2) || 0.0001;
              const t = 1 - d / pr;              // 1 en el centro, 0 en el borde
              const ux = dx / d, uy = dy / d;    // dirección radial (centro -> grano)
              if (mode === 'vortex') {
                // Rotación tangencial suave + atracción muy leve. Con el
                // campo de flujo el remolino queda orgánico, no caótico.
                const tang = t * 2.1 * pf;
                const inw  = t * 0.28 * pf;
                pt.vx += (-uy) * tang - ux * inw;
                pt.vy += ( ux) * tang - uy * inw;
              } else if (mode === 'pull') {
                // Atrae los granos hacia el dedo
                const pull = t * t * 3.4 * pf;
                pt.vx -= ux * pull;
                pt.vy -= uy * pull;
              } else {
                // Empuje radial (colisión) + arrastre con el movimiento del dedo
                const push = t * t * 4.2 * pf;
                pt.vx += ux * push + mvx * t * 0.32 * pf;
                pt.vy += uy * push + mvy * t * 0.32 * pf;
              }
            }
            pt = pt.next;
          }
        }
      }
    }

    // Integración + amortiguación + límite de velocidad
    for (let p = 0; p < particles.length; p++) {
      const pt = particles[p];
      pt.vx *= damp;
      pt.vy *= damp;
      // límite
      const v2 = pt.vx * pt.vx + pt.vy * pt.vy;
      if (v2 > maxV * maxV) {
        const s = maxV / Math.sqrt(v2);
        pt.vx *= s; pt.vy *= s;
      }
      pt.x += pt.vx;
      pt.y += pt.vy;
    }

    // Avanzar el histórico de punteros
    for (const ptr of pointers.values()) {
      ptr.px = ptr.x;
      ptr.py = ptr.y;
    }
  }

  // ---------- Render (minimal: puntos planos, agrupados por nivel) ----------
  function render() {
    ctx.fillStyle = '#050403';
    ctx.fillRect(0, 0, W, H);

    const ref = spacing * 0.5;          // velocidad a la que un grano llega a "negro"
    const last = LEVELS - 1;
    for (let li = 0; li <= last; li++) buckets[li].length = 0;

    // Clasificar cada grano en su nivel de gris según la velocidad
    for (let p = 0; p < particles.length; p++) {
      const pt = particles[p];
      const speed = Math.sqrt(pt.vx * pt.vx + pt.vy * pt.vy);
      let L = (1 - Math.min(1, speed / ref)) * pt.rest;  // 1 reposo -> 0 veloz
      let li = (L * last + 0.5) | 0;
      if (li < 0) li = 0; else if (li > last) li = last;
      buckets[li].push(pt);
    }

    // Un solo fill por nivel. Con muchos granos pequeños se usan cuadrados
    // (mucho más rápido y a ese tamaño se ven como puntos); con pocos granos
    // grandes se usan círculos, que quedan más limpios.
    const TWO_PI = Math.PI * 2;
    const useRect = grainR < 2.6;
    for (let li = 0; li <= last; li++) {
      const b = buckets[li];
      if (b.length === 0) continue;
      ctx.fillStyle = GRAY[li];
      if (useRect) {
        for (let n = 0; n < b.length; n++) {
          const pt = b[n];
          const r = grainR * pt.scale;
          const dd = r + r;
          ctx.fillRect(pt.x - r, pt.y - r, dd, dd);
        }
      } else {
        ctx.beginPath();
        for (let n = 0; n < b.length; n++) {
          const pt = b[n];
          const r = grainR * pt.scale;
          ctx.moveTo(pt.x + r, pt.y);
          ctx.arc(pt.x, pt.y, r, 0, TWO_PI);
        }
        ctx.fill();
      }
    }
  }

  function loop() {
    step();
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Resize ----------
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  // ---------- Punteros (touch + ratón) ----------
  function setPointer(id, x, y, active) {
    let ptr = pointers.get(id);
    if (!ptr) { ptr = { x, y, px: x, py: y, active }; pointers.set(id, ptr); }
    ptr.x = x; ptr.y = y; ptr.active = active;
    if (active && (ptr.px === undefined)) { ptr.px = x; ptr.py = y; }
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture?.(e.pointerId);
    const ptr = { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, active: true };
    pointers.set(e.pointerId, ptr);
    dismissHint();
  });
  canvas.addEventListener('pointermove', (e) => {
    // Solo actúa mientras se arrastra (dedo o ratón con botón pulsado).
    // Sin pulsar no hay fuerza -> los granos descansan en su sitio.
    const ptr = pointers.get(e.pointerId);
    if (ptr) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true; }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  function fmt(v, d = 2) { return Number(v).toFixed(d); }
  function syncLabels() {
    $('vDensity').textContent = cfg.density;
    $('vRadius').textContent = cfg.pointerR + 'px';
    $('vForce').textContent = fmt(cfg.pointerF, 1);
    $('vSpring').textContent = fmt(cfg.spring, 3);
    $('vCol').textContent = fmt(cfg.collision, 2);
    $('vFlow').textContent = fmt(cfg.flow, 2);
  }
  $('density').addEventListener('input', e => { cfg.density = +e.target.value; build(); syncLabels(); });
  $('radius').addEventListener('input',  e => { cfg.pointerR = +e.target.value; syncLabels(); });
  $('force').addEventListener('input',   e => { cfg.pointerF = +e.target.value; syncLabels(); });
  $('spring').addEventListener('input',  e => { cfg.spring = +e.target.value; syncLabels(); });
  $('collision').addEventListener('input', e => { cfg.collision = +e.target.value; syncLabels(); });
  $('flow').addEventListener('input',    e => { cfg.flow = +e.target.value; syncLabels(); });
  $('mode').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    cfg.mode = btn.dataset.mode;
    for (const b of $('mode').children) b.classList.toggle('on', b === btn);
  });
  $('reset').addEventListener('click', build);
  $('hide').addEventListener('click', () => { $('ui').classList.add('hidden'); $('toggleUi').classList.add('show'); });
  $('toggleUi').addEventListener('click', () => { $('ui').classList.remove('hidden'); $('toggleUi').classList.remove('show'); });

  let hintTimer = setTimeout(dismissHint, 6000);
  function dismissHint() { const h = $('hint'); if (h && !h.classList.contains('gone')) h.classList.add('gone'); clearTimeout(hintTimer); }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  // ---------- Arranque ----------
  syncLabels();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
